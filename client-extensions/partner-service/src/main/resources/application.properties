spring.config.import=\
    classpath:/application-default.properties,\
    optional:configtree:${LIFERAY_ROUTES_CLIENT_EXTENSION}/,\
    optional:configtree:${LIFERAY_ROUTES_DXP}/

#
# Registration uploads. PartnerSettings.maxUploadMb (at most 10, the attachment field cap) is
# enforced by RegistrationService; these limits only stop oversized requests early.
#

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

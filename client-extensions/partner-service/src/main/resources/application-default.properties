#
# OAuth. Both apps come from client-extension.yaml; Liferay writes their credentials to the
# routes folder that LIFERAY_ROUTES_CLIENT_EXTENSION points to.
#

liferay.oauth.application.external.reference.codes=\
    partner-service-oauth-headless-server,\
    partner-service-oauth-user-agent
liferay.oauth.urls.excludes=/actuator/health,/public/**

#
# Partner service
#

partner.headless.server.oauth.erc=partner-service-oauth-headless-server
partner.bootstrap.enabled=true

# The local bundle has only the Guest site, so the registration page is /web/guest/partner-registration
# (open question 28). Remove once the partners site exists.
partner.registration.path=/web/guest/partner-registration

#
# Spring Boot
#

management.endpoints.web.exposure.include=health
server.port=58081
